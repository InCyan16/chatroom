# Include these locations inside your existing HTTPS server {} block,
# which lives inside http {}. TLS certificates and HTTP redirects belong
# to that existing server configuration.
# data/config.json:
# production=true, bind="127.0.0.1:3000", trust="127.0.0.1",
# origins=["https://domain.com"], base_url="/commonroom/".

location = /commonroom {
    return 308 /commonroom/;
}

location /commonroom/ {
    # No trailing slash: preserve /commonroom/ for the Rust router.
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # Overwrite client-supplied headers; trust checks the socket peer IP.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
    client_max_body_size 8k;
}
